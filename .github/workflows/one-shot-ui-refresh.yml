name: one-shot-ui-refresh
on:
  push:
    branches: [agent/daily-verification-ui-overhaul]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def add_script(path, marker, tag):
              p=Path(path); s=p.read_text()
              if marker not in s:
                  raise SystemExit(f'marker not found: {path}')
              if 'sr_daily_verification.js' not in s:
                  s=s.replace(marker, marker+'\n'+tag, 1)
              p.write_text(s)

          add_script('index.html','</body>','<script src="sr_daily_verification.js?v=20260822-v1" defer></script>')
          add_script('portal_sr_x892.html','</body>','<script src="sr_daily_verification.js?v=20260822-v1" defer></script>')

          style=Path('style.css')
          style.write_text(style.read_text()+r'''
/* 20260822 UI refresh: simple, readable, responsive */
:root{--sr-ui-bg:#080b10;--sr-ui-panel:#0f141b;--sr-ui-line:#222a35;--sr-ui-text:#eef2f6;--sr-ui-muted:#8e99a8;--sr-ui-accent:#d9b76b}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;letter-spacing:normal!important}
button,input,select,textarea{font-family:inherit!important}
button{min-height:44px}
.glass-panel{box-shadow:0 18px 50px rgba(0,0,0,.28)!important}
.sr-auth-card,.sr-flow-shell,.sr-responsive-workspace-panel{border-color:var(--sr-ui-line)!important;background:var(--sr-ui-panel)!important;box-shadow:0 24px 70px rgba(0,0,0,.35)!important}
.sr-auth-card h2,.sr-flow-shell h2,.sr-responsive-workspace-panel h2,.sr-responsive-workspace-panel h3{letter-spacing:normal!important}
.sr-auth-card input,.sr-flow-shell input,.sr-flow-shell button,.sr-responsive-workspace-panel input,.sr-responsive-workspace-panel select,.sr-responsive-workspace-panel textarea{border-color:var(--sr-ui-line)!important}
.sr-auth-note,.sr-flow-step,.sr-spec-checklist,.sr-member-only-note,.sr-policy-strip{border-color:var(--sr-ui-line)!important;background:#10161e!important}
.sr-club-hero,.sr-club-section,.sr-content-intro,.sr-profile-intro,.sr-tab-intro{border-color:var(--sr-ui-line)!important;background:var(--sr-ui-panel)!important}
.sr-service,.sr-status,.sr-principle,.sr-milestone,.sr-preview-card{border-color:var(--sr-ui-line)!important;background:#0c1117!important}
.sr-service:hover,.sr-preview-card:hover{transform:none!important;border-color:#394352!important}
.sr-dashboard-left,.sr-dashboard-right{border-color:var(--sr-ui-line)!important}
@media(max-width:640px){.sr-club-hero,.sr-club-section,.sr-content-intro,.sr-profile-intro,.sr-tab-intro{border-radius:14px!important;padding:16px!important}.sr-service-grid,.sr-status-grid,.sr-principle-grid,.sr-milestone-grid,.sr-preview-grid{grid-template-columns:1fr!important}.sr-service{min-height:88px}.sr-responsive-workspace-panel{border-radius:0!important}}
''')

          admin=Path('admin.css')
          admin.write_text(admin.read_text()+r'''
/* 20260822 UI refresh: admin clarity */
:root{--sr-admin-bg:#080b10;--sr-admin-panel:#0f141b;--sr-admin-line:#222a35;--sr-admin-text:#eef2f6;--sr-admin-muted:#8e99a8;--sr-admin-accent:#d9b76b}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;letter-spacing:normal!important}
.admin-topbar{background:rgba(8,11,16,.96)!important;border-bottom-color:var(--sr-admin-line)!important;box-shadow:0 8px 28px rgba(0,0,0,.22)}
.admin-workspace-nav{background:#0c1117!important;border-color:var(--sr-admin-line)!important}
.admin-workspace-tab{font-size:.75rem!important}
.admin-summary-card,.admin-queue-button,.admin-section-card{background:var(--sr-admin-panel)!important;border-color:var(--sr-admin-line)!important;box-shadow:none!important}
.admin-summary-card strong,.admin-queue-button b{color:var(--sr-admin-accent)!important}
#admin-login-modal form{background:var(--sr-admin-panel)!important;border-color:var(--sr-admin-line)!important;box-shadow:0 24px 70px rgba(0,0,0,.4)!important}
#admin-login-modal input,#admin-login-modal button{min-height:46px!important;border-color:var(--sr-admin-line)!important}
.admin-empty-hint{border-color:var(--sr-admin-line)!important;color:var(--sr-admin-muted)!important}
@media(max-width:760px){.admin-topbar{position:sticky!important}.admin-workspace-nav{padding:4px!important}.admin-workspace-tab{min-height:44px!important}.admin-summary-card{min-height:82px!important}}
''')

          # Simplify high-noise admin labels without changing data or permissions.
          p=Path('portal_sr_x892.html'); s=p.read_text()
          replacements={
            '依功能分區管理會員、審核、內容、帳號安全與通知':'管理會員、審核、內容、安全與通知',
            '集中處理會員、頭像與黃金 Spec 申請。':'集中處理會員、頭像與黃金資格。',
            '平台內通知與 Telegram 外部通知分開管理；此區只負責平台公告與發送紀錄。':'管理站內公告與發送紀錄。',
            '舊 EmailJS 失敗紀錄（唯讀）':'舊通知失敗紀錄（唯讀）',
            '黃金 Spec':'黃金資格'
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Commit refresh and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-ui-refresh.yml
          git add index.html portal_sr_x892.html style.css admin.css sr_daily_verification.js
          git commit -m "feat: daily verification and unified UI refresh"
          git push
