name: Apply SecretRoom 2.0 modules
on:
  push:
    branches: [agent/secretroom-2-0-daily-verification-ui]
permissions:
  contents: write
jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[sr2-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire modules
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          tags='''<script src="sr_ui_v2.js?v=20260822-v1"></script>\n<script src="sr_daily_verification.js?v=20260822-v1"></script>\n'''
          if 'sr_daily_verification.js?v=20260822-v1' not in s:
              s=s.replace(marker,tags+marker,1)
          s=s.replace('content-interactions-v4','secretroom-2-ui-v1')
          p.write_text(s,encoding='utf-8')
          p=Path('portal_sr_x892.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          tag='<script src="sr_ui_v2.js?v=20260822-v1"></script>\n'
          if 'sr_ui_v2.js?v=20260822-v1' not in s:
              s=s.replace(marker,tag+marker,1)
          s=s.replace('admin-workspaces-v1','secretroom-2-ui-v1')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/apply-sr2-ui.yml
      - name: Commit wired version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html portal_sr_x892.html sr_ui_v2.js sr_daily_verification.js
          git add -u .github/workflows/apply-sr2-ui.yml
          git commit -m 'feat: SecretRoom 2.0 daily verification and UI refresh [sr2-wired]'
          git push