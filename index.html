<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="application-name" content="SecretRoom">
  <meta name="description" content="SecretRoom 是採人工審核的私密會員空間，讓會員管理、資格認證與交流更清楚、更安心。">
  <link rel="canonical" href="https://5j1u35k6.github.io/SecretRoom/">
  <link rel="icon" href="Gemini_Generated_Image_e2fxvje2fxvje2fx.jpg?v=5" type="image/jpeg">
  <link rel="apple-touch-icon" href="Gemini_Generated_Image_e2fxvje2fxvje2fx.jpg?v=5">
  <title>SecretRoom</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=20260827-simple1">
  <link rel="stylesheet" href="sr_design_system_v4.css?v=20260827-simple1">
</head>
<body class="club-groove-bg">
  <div id="app" class="min-h-[100dvh] w-full bg-transparent transition-all duration-300">
    <div id="loading-screen" class="fixed inset-0 z-50 grid place-items-center bg-white">
      <div class="sr-loading-card" role="status" aria-live="polite">
        <img src="Gemini_Generated_Image_e2fxvje2fxvje2fx.jpg?v=5" alt="SecretRoom" class="sr-loading-logo">
        <strong>SecretRoom</strong>
        <span>正在準備你的空間</span>
      </div>
    </div>
  </div>

  <div id="bgm-controller-widget" class="fixed bottom-4 right-4 z-[99]">
    <span id="bgm-status-text" class="sr-only">音樂已關閉</span>
    <button id="bgm-toggle-btn" type="button" class="sr-icon-button click-press" aria-label="播放背景音樂" aria-pressed="false" title="播放背景音樂">
      <i class="fa-solid fa-volume-xmark" id="bgm-icon"></i>
    </button>
  </div>

  <div id="toast-container" class="fixed top-4 left-1/2 z-[100] flex w-full max-w-sm -translate-x-1/2 flex-col gap-2 px-4" role="status" aria-live="polite" aria-atomic="true"></div>

  <div id="custom-confirm-modal" class="fixed inset-0 z-[101] hidden items-center justify-center bg-slate-950/35 p-4 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="custom-confirm-title" aria-describedby="custom-confirm-description" tabindex="-1">
    <div class="sr-modal-card text-center">
      <div class="sr-modal-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <h3 id="custom-confirm-title">確認操作？</h3>
      <p id="custom-confirm-description">此操作完成後無法復原，請再次確認。</p>
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button id="confirm-modal-cancel" class="sr-button sr-button-secondary click-press">取消</button>
        <button id="confirm-modal-ok" class="sr-button sr-button-primary click-press">確認</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js?v=20260827-simple1"></script>
  <script src="sr_club_complete.js?v=20260827-simple1" defer></script>
  <script src="sr_ui_v2.js?v=20260827-simple1"></script>
  <script src="sr_daily_verification.js?v=20260827-simple1"></script>
</body>
</html>
