<!doctype html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>SecretRoom｜後台</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="admin.css?v=20260827-simple1"><style>:root{color-scheme:light;--bg:#f6f7f9;--surface:#fff;--surface2:#f9fafb;--border:#e5e7eb;--text:#171923;--muted:#667085;--brand:#8a6a24;--brand-soft:#f5efe2}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans TC",system-ui,sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}.sr-login{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:24px}.sr-login-card{width:min(420px,100%);background:#fff;border:1px solid var(--border);border-radius:18px;padding:26px;box-shadow:0 18px 55px rgba(16,24,40,.1)}.sr-brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}.sr-brand-mark,.sr-title .icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}.sr-brand h1,.sr-title h1{margin:0;font-size:19px}.sr-brand p,.sr-title p{margin:3px 0 0;color:var(--muted);font-size:12px}.sr-field{margin-top:14px}.sr-field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.sr-field input{width:100%;height:46px;border:1px solid #cfd5dd;border-radius:10px;padding:0 13px;background:#fff;color:var(--text)}.sr-login-btn,.sr-primary{min-height:44px;border:0;border-radius:10px;background:var(--brand);color:#fff;padding:0 16px;font-weight:800}.sr-login-btn{width:100%;height:46px;margin-top:18px}.sr-login-error{margin-top:12px;padding:11px 12px;border-radius:10px;background:#fef3f2;border:1px solid #fecdca;color:#b42318;font-size:12px}.sr-main{width:min(1320px,100%);margin:auto;padding:18px 22px 44px}.sr-topbar{position:sticky;top:0;z-index:40;background:rgba(246,247,249,.96);backdrop-filter:blur(10px);padding:4px 0 12px}.sr-topbar-inner{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(16,24,40,.04)}.sr-toprow{display:flex;align-items:center;justify-content:space-between;gap:16px}.sr-title{display:flex;gap:11px;align-items:center}.sr-status{padding:8px 11px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:11px;color:var(--muted);white-space:nowrap}.sr-nav{display:flex;gap:6px;overflow:auto;margin-top:12px;padding:4px;background:var(--surface2);border:1px solid var(--border);border-radius:12px}.sr-nav button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);padding:9px 13px;border-radius:9px;font-size:12px;font-weight:700}.sr-nav button[aria-selected=true]{background:var(--brand);color:#fff}.sr-panel{margin-top:16px}.sr-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.sr-stat{min-height:102px;text-align:left;padding:16px;border:1px solid var(--border);border-radius:14px;background:#fff;color:var(--text)}.sr-stat span{display:block;font-size:12px;color:var(--muted);font-weight:700}.sr-stat strong{display:block;margin-top:8px;font-size:27px;color:var(--brand)}.sr-stat small{display:block;margin-top:7px;color:#98a2b3;font-size:10px}.sr-section{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px}.sr-section-head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:16px}.sr-kicker{display:none}.sr-section h2{font-size:20px;margin:0}.sr-section p{color:var(--muted);font-size:12px;margin:5px 0 0}.sr-controls{display:flex;gap:8px;flex-wrap:wrap}.sr-controls input,.sr-controls select,.sr-notice-grid input,.sr-notice-grid select,#broadcast-message{border:1px solid #cfd5dd;border-radius:10px;background:#fff;color:var(--text);padding:0 11px}.sr-controls input,.sr-controls select{height:42px;font-size:12px}.sr-controls input{min-width:250px}.sr-note{padding:12px 14px;border:1px dashed var(--border);background:var(--surface2);border-radius:12px;color:var(--muted);font-size:12px}.sr-notice-grid{display:grid;grid-template-columns:180px 1fr;gap:10px}.sr-notice-grid input,.sr-notice-grid select{height:44px}#broadcast-message{width:100%;min-height:130px;margin-top:10px;padding:11px}#admin-list{display:grid;gap:12px}@media(max-width:1100px){.sr-summary{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){.sr-main{padding:12px}.sr-title p{display:none}.sr-summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.sr-stat{min-height:88px;padding:13px}.sr-stat strong{font-size:22px}.sr-section{padding:15px}.sr-section-head{align-items:stretch;flex-direction:column}.sr-controls{display:grid;grid-template-columns:1fr}.sr-controls input{min-width:0}.sr-notice-grid{grid-template-columns:1fr}}</style></head><body><div id="admin-login-modal" class="sr-login"><form id="admin-login-form" class="sr-login-card" novalidate><div class="sr-brand"><div class="sr-brand-mark"><i class="fa-solid fa-user-shield"></i></div><div><h1>SecretRoom 後台</h1><p>登入後處理會員與通知</p></div></div><div class="sr-field"><label for="admin-login-id">管理員帳號</label><input id="admin-login-id" name="username" autocomplete="username" required autofocus></div><div class="sr-field"><label for="admin-login-password">密碼</label><input id="admin-login-password" name="password" type="password" autocomplete="current-password" required></div><div id="admin-login-error" class="sr-login-error hidden" role="alert"></div><button id="admin-login-submit" class="sr-login-btn" type="submit">登入</button></form></div><main id="admin-main" class="sr-main hidden"><div class="sr-topbar"><div class="sr-topbar-inner"><div class="sr-toprow"><div class="sr-title"><div class="icon"><i class="fa-solid fa-user-shield"></i></div><div><h1>SecretRoom 後台</h1><p>只保留今天需要處理的事</p></div></div><div id="connection-status" class="sr-status">準備中…</div></div><nav class="sr-nav"><button data-admin-workspace="overview" aria-selected="true">總覽</button><button data-admin-workspace="review" aria-selected="false">審核</button><button data-admin-workspace="members" aria-selected="false">會員</button><button data-admin-workspace="content" aria-selected="false">檢舉</button><button data-admin-workspace="security" aria-selected="false">安全</button><button data-admin-workspace="notifications" aria-selected="false">通知</button><button data-admin-workspace="system" aria-selected="false">紀錄</button></nav></div></div><section id="admin-panel-overview" class="sr-panel"><div class="sr-summary"><button class="sr-stat" data-queue-filter="pending"><span>待審核</span><strong id="count-pending">-</strong><small>處理申請</small></button><button class="sr-stat" data-queue-filter="avatar_pending"><span>頭像待審</span><strong id="count-avatar-pending">-</strong><small>查看照片</small></button><button class="sr-stat" data-queue-filter="reported_posts"><span>檢舉</span><strong id="count-reports">-</strong><small>檢查內容</small></button><button class="sr-stat" data-queue-filter="approved"><span>會員</span><strong id="count-total">-</strong><small>搜尋管理</small></button><button class="sr-stat" data-queue-filter="email_failures"><span>系統</span><strong id="count-admins">-</strong><small>查看紀錄</small></button></div><div class="sr-section" style="margin-top:12px"><div class="sr-note">點擊數字卡片即可進入對應工作區。</div></div></section><section id="admin-panel-manage" class="sr-panel hidden"><div class="sr-section"><div class="sr-section-head"><div><div id="admin-workspace-kicker" class="sr-kicker"></div><h2 id="admin-workspace-title">審核</h2><p id="admin-workspace-description">集中處理需要人工判斷的項目。</p></div><div class="sr-controls"><input id="admin-search" oninput="filterApplications()" placeholder="搜尋帳號、暱稱、Email 或 Telegram"><select id="filter-status" onchange="filterApplications()"><option value="all">全部</option><option value="pending" selected>待審核</option><option value="avatar_pending">頭像待審</option><option value="spec_pending">Spec 待審</option><option value="reported_posts">貼文檢舉</option><option value="reported_comments">留言檢舉</option><option value="account_delete_requests">刪除帳號</option><option value="password_reset_requests">忘記密碼</option><option value="email_failures">寄信失敗</option><option value="approved">已通過</option><option value="active">使用中</option><option value="rejected">已拒絕</option></select></div></div><div id="admin-list"><div class="sr-note" style="text-align:center;padding:40px">正在準備資料…</div></div></div></section><section id="admin-panel-notifications" class="sr-panel hidden"><div class="sr-section"><div class="sr-section-head"><div><h2>通知</h2><p>撰寫平台公告，並查看發送紀錄。</p></div></div><div class="sr-notice-grid"><select id="broadcast-target"><option value="all">全體會員</option><option value="sg">S+ · S · G</option></select><input id="broadcast-title" placeholder="通知標題"></div><textarea id="broadcast-message" placeholder="輸入通知內容"></textarea><div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="sr-primary" onclick="sendPlatformBroadcast()">發送</button></div><div style="margin-top:22px;border-top:1px solid var(--border);padding-top:18px"><strong style="font-size:13px">發送紀錄</strong><span id="broadcast-history-count" style="float:right;font-size:11px;color:var(--muted)">-</span><div id="broadcast-history" style="display:grid;gap:8px;margin-top:10px;max-height:420px;overflow:auto"></div></div></div></section></main><div id="zoom-modal" class="fixed inset-0 bg-black/90 z-[100] flex items-center justify-center hidden" onclick="closeZoomModal()"><img id="zoom-modal-img" class="max-w-[90vw] max-h-[85vh] object-contain rounded-xl" alt="放大檢視"></div><div id="reject-reason-modal" class="fixed inset-0 bg-black/40 z-[250] flex items-center justify-center hidden"><div id="reject-reason-content" class="sr-login-card"><h3>拒絕申請</h3><label><input type="radio" name="rejection-reason" value="頭像不符合規範，請更換清楚真實照片。"> 頭像不符合規範</label><label><input type="radio" name="rejection-reason" value="暱稱或個人資料需要修改。"> 個人資料需要修改</label><label><input type="radio" name="rejection-reason" value="資料不完整，請補齊後再申請。"> 資料不完整</label><label><input type="radio" name="rejection-reason" value="本次申請未通過，請聯絡管理員。"> 申請未通過</label><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button onclick="closeRejectReasonModal()">取消</button><button id="confirm-reject-btn" class="sr-primary">拒絕</button></div></div></div><div id="delete-modal" class="fixed inset-0 bg-black/40 z-[250] flex items-center justify-center hidden"><div id="delete-modal-content" class="sr-login-card"><h3>刪除帳號</h3><p style="color:var(--muted);font-size:13px">帳號與相關資料會永久刪除，無法復原。</p><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button onclick="closeDeleteModal()">取消</button><button id="confirm-delete-btn" style="background:#b42318;color:#fff;border:0;border-radius:10px;padding:10px 14px">永久刪除</button></div></div></div><div id="toast-container" style="position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:300;display:grid;gap:8px;width:min(420px,calc(100% - 24px))" role="status" aria-live="polite"></div><script type="module" src="admin_bootstrap.js?v=20260827-simple1"></script><script type="module" src="admin.js?v=20260827-simple1"></script><script src="sr_ui_v2.js?v=20260827-simple1"></script><script>(()=>{const p={overview:document.getElementById('admin-panel-overview'),manage:document.getElementById('admin-panel-manage'),notifications:document.getElementById('admin-panel-notifications')},f=document.getElementById('filter-status'),t=document.getElementById('admin-workspace-title'),d=document.getElementById('admin-workspace-description'),k=document.getElementById('admin-workspace-kicker'),c={overview:{panel:'overview'},review:{panel:'manage',filter:'pending',title:'審核',description:'集中處理需要人工判斷的項目。'},members:{panel:'manage',filter:'approved',title:'會員',description:'搜尋、檢視與管理已通過會員。'},content:{panel:'manage',filter:'reported_posts',title:'檢舉',description:'處理貼文與留言檢舉。'},security:{panel:'manage',filter:'password_reset_requests',title:'安全',description:'處理密碼復原與刪除帳號申請。'},notifications:{panel:'notifications'},system:{panel:'manage',filter:'email_failures',title:'紀錄',description:'查看通知與系統紀錄。'}};function a(n,x=''){let q=c[n]||c.overview;Object.values(p).forEach(e=>e?.classList.add('hidden'));p[q.panel]?.classList.remove('hidden');document.querySelectorAll('[data-admin-workspace]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.adminWorkspace===n)));if(q.panel==='manage'){f.value=x||q.filter||'all';k.textContent='';t.textContent=q.title||'';d.textContent=q.description||'';window.filterApplications?.()}sessionStorage.setItem('sr_admin_workspace',n)}document.querySelectorAll('[data-admin-workspace]').forEach(b=>b.onclick=()=>a(b.dataset.adminWorkspace));document.querySelectorAll('[data-queue-filter]').forEach(b=>b.onclick=()=>{let v=b.dataset.queueFilter,w=['reported_posts','reported_comments'].includes(v)?'content':['password_reset_requests','account_delete_requests'].includes(v)?'security':v==='email_failures'?'system':['approved','active','rejected'].includes(v)?'members':'review';a(w,v)});document.getElementById('admin-login-form')?.addEventListener('submit',e=>{e.preventDefault();document.getElementById('admin-login-submit')?.click()});a(sessionStorage.getItem('sr_admin_workspace')||'overview')})()</script></body></html>
