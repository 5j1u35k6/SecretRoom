ght:800}.sr-login-error{margin-top:12px;padding:11px 12px;border-radius:10px;background:#fef3f2;border:1px solid #fecdca;color:#b42318;font-size:12px}.sr-main{width:min(1440px,100%);margin:auto;padding:20px 24px 48px}.sr-topbar{position:sticky;top:0;z-index:40;background:rgba(243,245,247,.95);backdrop-filter:blur(10px);padding:4px 0 14px}.sr-topbar-inner{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px 16px;box-shadow:0 4px 18px rgba(16,24,40,.04)}.sr-toprow{display:flex;align-items:center;justify-content:space-between;gap:16px}.sr-title{display:flex;gap:11px;align-items:center}.sr-title .icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#f7f1e2;color:var(--brand)}.sr-title h1{margin:0;font-size:18px}.sr-title p{margin:3px 0 0;font-size:11px;color:var(--muted)}.sr-status{padding:8px 11px;border-radius:999px;background:#f8fafb;border:1px solid var(--border);font-size:11px;color:var(--muted);white-space:nowrap}.sr-nav{display:flex;gap:6px;overflow:auto;margin-top:12px;padding:4px;background:#f8fafb;border:1px solid var(--border);border-radius:12px}.sr-nav button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);padding:9px 13px;border-radius:9px;font-size:12px;font-weight:700}.sr-nav button[aria-selected=true]{background:var(--brand);color:#fff}.sr-panel{margin-top:18px}.sr-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.sr-stat{min-height:110px;text-align:left;padding:17px;border:1px solid var(--border);border-radius:14px;background:#fff;color:var(--text)}.sr-stat:hover{border-color:#d5c39b;box-shadow:0 8px 22px rgba(16,24,40,.06)}.sr-stat span{display:block;font-size:12px;color:var(--muted);font-weight:700}.sr-stat strong{display:block;margin-top:9px;font-size:28px;color:var(--brand)}.sr-stat small{display:block;margin-top:8px;color:#98a2b3;font-size:10px}.sr-section{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px}.sr-secti ss="sr-field"><label for="admin-login-password">密碼</label><input id="admin-login-password" name="password" type="password" autocomplete="current-password" required></div><div id="admin-login-error" class="sr-login-error hidden" role="alert"></div><button id="admin-login-submit" class="sr-login-btn" type="submit">登入後台</button></form></div><main id="admin-main" class="sr-main hidden"><div class="sr-topbar"><div class="sr-topbar-inner"><div class="sr-toprow"><div class="sr-title"><div class="icon"><i class="fa-solid fa-user-shield"></i></div><div><h1>SecretRoom 管理後台</h1><p>會員、審核、內容、安全與通知</p></div></div><div id="connection-status" class="sr-status">正在準備…</div></div><nav class="sr-nav"><button data-admin-workspace="overview" aria-selected="true">總覽</button><button data-admin-workspace="review" aria-selected="false">審核中心</button><button data-admin-workspace="members" aria-selected="false">會員管理</button><button data-admin-workspace="content" aria-selected="false">內容與檢舉</button><button data-admin-workspace="security" aria-selected="false">帳號安全</button><button data-admin-workspace="notifications" aria-selected="false">平台通知</button><button data-admin-workspace="system" aria-selected="false">系統紀錄</button></nav></div></div><section id="admin-panel-overview" class="sr-panel"><div class="sr-summary"><button class="sr-stat" data-queue-filter="pending"><span>待審核會員</span><strong id="count-pending">-</strong><small>前往審核中心</small></button><button class="sr-stat" data-queue-filter="avatar_pending"><span>頭像／身分待審</span><strong id="count-avatar-pending">-</strong><small>查看待處理項目</small></button><button class="sr-stat" data-queue-filter="reported_posts"><span>檢舉待處理</span><strong id="count-reports">-</strong><small>前往內容與檢舉</small></button><button class="sr-stat" data-queue-filter="approved"><span>會員總數</span><strong id="count-total">-</strong><small>開啟會員管理</small></button><button class="sr-stat" data-queue-filter="email_failures"><span>後台管理員</span><strong id="count-admins">-</strong><small>系統與 "module" src="admin_bootstrap.js?v=20260826-v1"></script><script type="module" src="admin.js?v=20260826-v6"></script><script src="sr_ui_v2.js?v=20260822-v2"></script><script>(()=>{const p={overview:document.getElementById('admin-panel-overview'),manage:document.getElementById('admin-panel-manage'),notifications:document.getElementById('admin-panel-notifications')},f=document.getElementById('filter-status'),t=document.getElementById('admin-workspace-title'),d=document.getElementById('admin-workspace-description'),k=document.getElementById('admin-workspace-kicker'),c={overview:{panel:'overview'},review:{panel:'manage',filter:'pending',kicker:'REVIEW CENTER',title:'審核中心',description:'集中處理新會員、頭像與黃金 Spec 申請。'},members:{panel:'manage',filter:'approved',kicker:'MEMBER DIRECTORY',title:'會員管理',description:'搜尋已通過與使用中的會員。'},content:{panel:'manage',filter:'reported_posts',kicker:'CONTENT SAFETY',title:'內容與檢舉',description:'集中處理貼文與留言檢舉。'},security:{panel:'manage',filter:'password_reset_requests',kicker:'ACCOUNT SECURITY',title:'帳號安全',description:'查看密碼復原與刪除帳號申請。'},notifications:{panel:'notifications'},system:{panel:'manage',filter:'email_failures',kicker:'SYSTEM RECORDS',title:'系統紀錄',description:'檢查通知與系統稽核紀錄。'}};function a(n,x=''){let q=c[n]||c.overview;Object.values(p).forEach(e=>e?.classList.add('hidden'));p[q.panel]?.classList.remove('hidden');document.querySelectorAll('[data-admin-workspace]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.adminWorkspace===n)));if(q.panel==='manage'){f.value=x||q.filter||'all';k.textContent=q.kicker||'';t.textContent=q.title||'';d.textContent=q.description||'';window.filterApplications?.()}sessionStorage.setItem('sr_admin_workspace',n)}document.querySelectorAll('[data-admin-workspace]').forEach(b=>b.onclick=()=>a(b.dataset.adminWorkspace));document.querySelectorAll('[data-queue-filter]').forEach(b=>b.onclick=()=>{let v=b.dataset.queueFilter,w=['reported_posts','reported_comments'].includes(v)?'content':['password_reset_requests','account_delete_requests'].includes(v)?'security':v==='email_failures'?'system':['approved','active','rejected'].includes(v)?'members':'review';a(w,v)});document.getElementById('admin-login-form')?.addEventListener('submit',e=>{e.preventDefault();document.getElementById('admin-login-submit')?.click()});a(sessionStorage.getItem('sr_admin_workspace')||'overview')})()</script></body></html>
